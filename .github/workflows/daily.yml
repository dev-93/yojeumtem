name: Daily shopping trends

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopping-trends-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Preview product candidates (no external writes)
        run: npm run daily -- --preview
